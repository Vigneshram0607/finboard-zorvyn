<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>FinBoard — Smart Financial Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Plus Jakarta Sans: modern, clean, excellent legibility at all sizes -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Mono:wght@400;500&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  <script>
    // Apply persisted theme before Angular boots — prevents white flash
    try {
      const t = localStorage.getItem('finboard_v1_theme');
      if (t) document.documentElement.setAttribute('data-theme', JSON.parse(t));
    } catch(e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
